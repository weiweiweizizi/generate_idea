# Example config only.
# It assumes toy single-axis results generated from a closed flat-leaf
# contour deforming toward a near-rectangular mouth-opening shape.

experiment:
  name: toy_leaf_to_rectangle_compose_xy
  output_dir: outputs/matrix_vis/examples/toy_leaf_to_rectangle_compose_xy

mesh:
  source: data/toy/matrix_vis/leaf_to_rectangle_mouth_opening/mesh_2d.npy
  format: numpy
  dimension: 2d
  point_ids: auto

inputs:
  x_solution: outputs/matrix_vis/examples/toy_leaf_to_rectangle_axis_x/solution.npz
  y_solution: outputs/matrix_vis/examples/toy_leaf_to_rectangle_axis_y/solution.npz

compose:
  subset_policy: intersection

export:
  save_npz: true
  save_json_summary: true
  save_animation_preview: true
